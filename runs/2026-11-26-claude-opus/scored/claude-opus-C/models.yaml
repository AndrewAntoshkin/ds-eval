models:
  fixture:
    provider: fixture
    pack: good
    label: Fixture (DS-aware)

  fixture-naive:
    provider: fixture
    pack: naive
    label: Fixture (naive)

  claude:
    provider: anthropic
    model: claude-sonnet-4-5
    label: Claude

  codex:
    provider: openai
    model: gpt-4.1
    label: Codex

  # Answers generated by Claude Opus 5.5 in Cursor cloud subagents (no API call at score time).
  claude-opus-A:
    provider: replay
    model: claude-opus-5.5
    path: runs/2026-11-26-claude-opus/A
    label: Claude Opus 5.5, no DS context

  claude-opus-B:
    provider: replay
    model: claude-opus-5.5
    path: runs/2026-11-26-claude-opus/B
    label: Claude Opus 5.5 + DESIGN.md

  claude-opus-C:
    provider: replay
    model: claude-opus-5.5
    path: runs/2026-11-26-claude-opus/C
    label: Claude Opus 5.5 + DS artifact
